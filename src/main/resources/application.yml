spring:
  application:
    name: procureflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/procureflow}
    username: ${DB_USERNAME:procureflow}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: none        # schema is managed by Flyway; switch to 'validate' once entities are complete
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:5173}

server:
  port: 8080
